import com.smart.lsap.TclFusionAarPatchTask
import com.smart.lsap.TclFusionBundleTask

plugins {
    alias(libs.plugins.android.library)
}

apply from: "$rootDir/gradle/jitpack-publish.gradle"

base {
    archivesName = 'ad-sdk-fusion'
}

def patchTcl = tasks.register('patchTclFusionAar', TclFusionAarPatchTask) {
    inputAar.set(layout.projectDirectory.file('vendor/base/sdk.aar'))
    outputAar.set(layout.buildDirectory.file('tcl/base-patched.aar'))
}
def prepareTcl = tasks.register('prepareEmbeddedTcl', TclFusionBundleTask) {
    baseAar.set(patchTcl.flatMap { it.outputAar })
    mediaAar.set(layout.projectDirectory.file('vendor/media/sdk.aar'))
    playerAar.set(layout.projectDirectory.file('vendor/player/sdk.aar'))
    outputDirectory.set(layout.buildDirectory.dir('generated/embeddedTcl'))
}
def embeddedTclDir = layout.buildDirectory.dir('generated/embeddedTcl')

android {
    namespace 'com.smart.android.adsdk.fusion'
    compileSdk 36

    defaultConfig {
        minSdk 23
        consumerProguardFiles 'consumer-rules.pro'
        consumerProguardFiles embeddedTclDir.map { it.file('consumer-rules.pro').asFile }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main {
        resources.srcDir embeddedTclDir.map { it.dir('java-resources').asFile }
        ['base', 'media', 'player'].each { component ->
            res.srcDir embeddedTclDir.map { it.dir("${component}/res").asFile }
            assets.srcDir embeddedTclDir.map { it.dir("${component}/assets").asFile }
        }
    }

}

tasks.named('preBuild').configure { dependsOn prepareTcl }
tasks.matching { it.name == 'sourceReleaseJar' }.configureEach { dependsOn prepareTcl }

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.3.0')
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.10.1'
    implementation 'androidx.media3:media3-ui:1.10.1'
    implementation 'androidx.media3:media3-exoplayer-ima:1.10.1'

    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    ['base', 'media', 'player'].each { component ->
        implementation files(embeddedTclDir.map { it.file("libs/tcl-${component}.jar").asFile }).builtBy(prepareTcl)
    }
    implementation 'com.google.guava:guava:33.5.0-android'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    implementation 'com.iabtcf:iabtcf-encoder:2.0.10'
    implementation('com.thoughtworks.xstream:xstream:1.4.18') {
        exclude group: 'xmlpull', module: 'xmlpull'
    }
    testImplementation 'junit:junit:4.13.2'
}
