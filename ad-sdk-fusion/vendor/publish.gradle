import com.smart.lsap.TclFusionAarPatchTask

// Publish the same artifact used locally, including the fusion-only TCL identity patch.
apply plugin: 'base'
apply plugin: 'maven-publish'
group = findProperty('PUBLISH_GROUP_ID') ?: System.getenv('GROUP') ?: 'com.github.code-rebooter.ad-app'
version = findProperty('PUBLISH_VERSION') ?: System.getenv('VERSION') ?: '0.0.0-local'
configurations { maybeCreate('default') }
def publishedAar = file('sdk.aar')
def patchTask = null
if (project.name == 'ad-sdk-fusion-tcl-base') {
    publishedAar = layout.buildDirectory.file('patched/sdk.aar')
    patchTask = tasks.register('patchTclFusionAar', TclFusionAarPatchTask) {
        inputAar.set(layout.projectDirectory.file('sdk.aar'))
        outputAar.set(publishedAar)
    }
}
artifacts {
    add('default', publishedAar) {
        if (patchTask != null) builtBy(patchTask)
    }
}
publishing {
    publications {
        release(MavenPublication) {
            groupId = project.group.toString()
            artifactId = project.name
            version = project.version.toString()
            artifact(publishedAar) {
                if (patchTask != null) builtBy(patchTask)
            }
            pom { name = project.name; description = 'TCL overseas SDK 2.8.02 binary dependency for ad-sdk-fusion' }
        }
    }
}
