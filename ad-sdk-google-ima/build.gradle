def sha256 = { File input ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        int count
        while ((count = stream.read(buffer)) != -1) {
            digest.update(buffer, 0, count)
        }
    }
    digest.digest().encodeHex().toString()
}

def verifyControlledGoogleImaAars = tasks.register('verifyControlledGoogleImaAars') {
    dependsOn controlledAarCopies.collect { it.task }
    inputs.files controlledAarCopies.collect { it.generated }
    inputs.files controlledAarCopies.collect { it.published }
    doLast {
        controlledAarCopies.each { copy ->
            File generated = copy.generated.get().asFile
            File published = copy.published
            if (!published.isFile()) {
                throw new GradleException("Missing controlled Google IMA artifact: ${published}")
            }
            String generatedSha = sha256(generated)
            String publishedSha = sha256(published)
            if (generatedSha != publishedSha) {
                throw new GradleException(
                        "Controlled Google IMA artifact is stale: ${published.name}; " +
                                "generated=${generatedSha}, published=${publishedSha}"
                )
            }
        }
    }
}

