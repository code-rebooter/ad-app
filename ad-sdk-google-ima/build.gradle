def singleArtifact = { configuration, label ->
    configuration.incoming.artifactView {}.files.elements.map { locations ->
        if (locations.size() != 1) {
            throw new GradleException("Expected one ${label} AAR, found ${locations.size()}")
        }
        locations.iterator().next().asFile
    }
}

def registerPatchedAar = { taskName, configuration, label, outputName, sha256, target ->
    def task = tasks.register(taskName, com.smart.lsap.Hq008AarPatchTask) {
        inputAar.set(layout.file(singleArtifact(configuration, label)))
        outputAar.set(layout.buildDirectory.file("generated/patched-dependencies/${outputName}"))
        expectedSha256.set(sha256)
        targetFlavor.set(target)
    }
    def artifact = files(layout.buildDirectory.file("generated/patched-dependencies/${outputName}"))
    artifact.builtBy(task)
    return artifact
}

