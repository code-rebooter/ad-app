plugins {
    alias(libs.plugins.android.application)
}

apply from: rootProject.file('ad-sdk-tcl/gradle/runtime-alignment.gradle')

android {
    namespace 'com.smart.android.tclad.demo'
    compileSdk 36
    defaultConfig {
        applicationId 'com.smart.android.tclad.demo.isolated'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':ad-sdk-tcl')
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
