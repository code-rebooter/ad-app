plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
}
apply from: rootProject.file('ad-sdk-tcl/gradle/runtime-alignment.gradle')
android {
    namespace 'com.smart.android.tclad'
    compileSdk 36
    defaultConfig { minSdk 24; consumerProguardFiles 'consumer-rules.pro' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    api project(':ad-sdk-tcl:runtime-media')
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'
    implementation 'com.google.guava:guava:31.1-android'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation('com.thoughtworks.xstream:xstream:1.4.18') { exclude group: 'xmlpull', module: 'xmlpull' }
    // JVM tests need the real XML Pull API; Android supplies it on devices.
    testImplementation 'xmlpull:xmlpull:1.1.3.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }
