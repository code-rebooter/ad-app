    defaultConfig {
        applicationId "com.smart.android.ad_app"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
            java.srcDirs = ['src/main/java']
        }

        hq001 {
            java.srcDirs = ['src/hq001/java']
