android.applicationVariants.all { variant ->
    def flavor = variant.flavorName
    def libsDir = file("libs/${flavor}")
    if (libsDir.exists()) {
        def filesToLoad = fileTree(dir: libsDir, include: ['*.jar', '*.aar'])
        def dependency = project.dependencies.create(filesToLoad)
        variant.getCompileConfiguration().dependencies.add(dependency)
        variant.getRuntimeConfiguration().dependencies.add(dependency) // ✅ 必须加这句！
    }
}


