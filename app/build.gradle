def lsapPatchedAars = [:]
lsapPatchedAarSpecs.each { flavor, spec ->
    def patchTask = tasks.register(spec.task, com.smart.lsap.LsapAarPatchTask) {
        inputAar.set(file(spec.input))
        outputAar.set(layout.buildDirectory.file(spec.output))
        expectedSha256.set(spec.sha256)
        targetFlavor.set(flavor)
    }
    def patchedAar = files(layout.buildDirectory.file(spec.output))
    patchedAar.builtBy(patchTask)
    lsapPatchedAars[flavor] = patchedAar
}


android.applicationVariants.all { variant ->
    def flavor = variant.flavorName
    if (lsapPatchedAars.containsKey(flavor)) {
        return
    }
    def libsDir = file("libs/${flavor}")
    if (libsDir.exists()) {
        def filesToLoad = fileTree(dir: libsDir, include: ['*.jar', '*.aar'])
        def dependency = project.dependencies.create(filesToLoad)
        variant.getCompileConfiguration().dependencies.add(dependency)
        variant.getRuntimeConfiguration().dependencies.add(dependency) // ✅ 必须加这句！
    }
}

