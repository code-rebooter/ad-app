android.applicationVariants.all { variant ->
    def flavor = variant.flavorName
    def libsDir = file("libs/${flavor}")
    if (libsDir.exists()) {
        def filesToLoad = fileTree(dir: libsDir, include: ['*.jar', '*.aar'])
        def dependency = project.dependencies.create(filesToLoad)
        variant.getCompileConfiguration().dependencies.add(dependency)
        variant.getRuntimeConfiguration().dependencies.add(dependency) // ✅ 必须加这句！
    }
}


dependencies {

    implementation libs.androidx.core.ktx
    implementation files('libs/lib_autorun.aar')
    api 'com.squareup.okhttp3:okhttp:4.12.0'
    api 'com.google.code.gson:gson:2.12.1'
    api "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    api "androidx.work:work-runtime-ktx:2.9.0"
