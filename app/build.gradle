        }
        hq006 {
            java.srcDirs = ['src/hq006/java']
        }
    }

    signingConfigs {

        hikeen {
            storeFile file("HikeenKeystore.jks")
            storePassword '123456'
            keyAlias 'zeasn'
            keyPassword '123456'
        }

        h713 {
            storeFile file("h713.jks")
            storePassword "123456"
            keyAlias "h713"
            keyPassword "123456"
        }

        x88 {
            storeFile file("platform_x88.keystore")
            storePassword "platform"
            keyAlias "platform"
            keyPassword "platform"
        }

        yxt {
            storeFile file("yxt_X98K_10.keystore")
            //storeFile file("platform_X98K_301.keystore")
            storePassword "android"
            keyAlias "platform"
            keyPassword "android"
        }

    }

    buildTypes {
        release {
            minifyEnabled true
            zipAlignEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug{
            minifyEnabled false
            signingConfig signingConfigs.h713
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

