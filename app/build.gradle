android.applicationVariants.configureEach { variant ->
    if (variant.buildType.name != "release") {
        return
    }
    def timestamp = new SimpleDateFormat("yyyyMMdd_HHmm").with {
        setTimeZone(TimeZone.getTimeZone("Asia/Shanghai"))
        format(new Date())
    }
    variant.outputs.configureEach { output ->
        def flavorName = variant.flavorName ?: "main"
        outputFileName = "app-${flavorName}-${variant.buildType.name}-${timestamp}.apk"
    }
}

