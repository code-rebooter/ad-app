android.applicationVariants.configureEach { variant ->
    if (variant.buildType.name != "release") {
        return
    }
    def timestamp = new SimpleDateFormat("yyyyMMdd_HHmm").with {
        setTimeZone(TimeZone.getTimeZone("Asia/Shanghai"))
        format(new Date())
    }
    variant.outputs.configureEach { output ->
        def flavorName = variant.flavorName ?: "main"
        outputFileName = "app-${flavorName}-${variant.buildType.name}-${timestamp}.apk"
    }
}


android.applicationVariants.all { variant ->
    def flavor = variant.flavorName
    def libsDir = file("libs/${flavor}")
    if (libsDir.exists()) {
        def filesToLoad = fileTree(dir: libsDir, include: ['*.jar', '*.aar'])
        def dependency = project.dependencies.create(filesToLoad)
        variant.getCompileConfiguration().dependencies.add(dependency)
        variant.getRuntimeConfiguration().dependencies.add(dependency) // ✅ 必须加这句！
    }
}

androidComponents {
    onVariants(selector().withBuildType("debug").withFlavor("ad", "hq008")) { variant ->
        variant.signingConfig.setConfig(android.signingConfigs.getByName("tclDemoRelease"))
