pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        maven { url 'https://jitpack.io' }
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url 'https://maven.aliyun.com/repository/central' }
        mavenCentral()
        maven { url 'https://jitpack.io' }
        flatDir {
            dirs 'libs'
        }
    }
}

rootProject.name = "AD_APP"
include ':app'
include ':ad-sdk'
include ':ad-sdk-modern'
include ':ad-sdk-modern-no-ump'
include ':ad-sdk-gam-vast'
include ':ad-sdk-gam-vast-demo'
include ':hq008-flow-sdk'
include ':hq008-flow-demo'

include ':ad-sdk-fusion'
include ':ad-sdk-tcl'
include ':ad-sdk-tcl-demo'

include ':ad-sdk-tcl:runtime-base'

include ':ad-sdk-tcl:runtime-player'

include ':ad-sdk-tcl:runtime-media'

include ':ad-sdk-universal'
